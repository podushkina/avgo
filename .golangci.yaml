version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    revive:
      rules:
        - name: exported
          disabled: true # не требуем godoc на каждый экспортированный символ
    gosec:
      excludes:
        - G404 # math/rand достаточно для выбора варианта реплики

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
