name: avito-antifraud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antifraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antifraud}
      POSTGRES_DB: ${POSTGRES_DB:-antifraud}
    ports:
      - "5433:5432" # 5433 снаружи: 5432 на хосте часто занят локальным Postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifraud} -d ${POSTGRES_DB:-antifraud}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-antifraud}:${POSTGRES_PASSWORD:-antifraud}@postgres:5432/${POSTGRES_DB:-antifraud}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  ai:
    build:
      context: ./services/ai
    environment:
      HTTP_ADDR: ":8082"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      DIALOG_MAX_TURNS: ${DIALOG_MAX_TURNS:-20}
      DIALOG_SESSION_TTL: ${DIALOG_SESSION_TTL:-30m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
      - ai

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "${LLM_MODEL:-qwen2.5:7b}"']
    restart: "no"

volumes:
  pgdata:
  ollama:
