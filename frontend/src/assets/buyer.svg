    <path d="M516 362c18 5 31 11 43 20" fill="none" stroke="#e76f47" stroke-width="4"/>
    <path d="M488 393c16 1 31 4 43 10" fill="none" stroke="#e76f47" stroke-width="4"/>

    <!-- banknotes -->
    <g>
      <path d="M533 300l126-24 12 70-126 24z" fill="#4fb52b"/>
      <path d="M520 318l130-19 10 70-130 19z" fill="#64cc35"/>
      <path d="M508 335l132-16 10 72-132 16z" fill="#79df45"/>
      <path d="M523 346l103-13 7 49-103 13z" fill="#a3ef69" stroke="#2b8c28" stroke-width="5"/>
      <circle cx="578" cy="364" r="17" fill="#2d9c2c" stroke="#237a23" stroke-width="4"/>
      <circle cx="535" cy="369" r="5" fill="#2d9c2c" stroke="none"/>
      <circle cx="621" cy="358" r="5" fill="#2d9c2c" stroke="none"/>
    </g>
  </g>
</svg>
