    <path d="M520 344c-39 22-81 43-127 52-37 7-73 3-109-6l-48-12c-20-5-37 3-41 19-4 15 9 28 30 31l56 8c48 7 100 11 149-5 44-14 83-35 118-61z" fill="url(#sellerSkin)"/>

