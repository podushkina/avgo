<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="sellerTitle sellerDesc">
  <title id="sellerTitle">Продавец передает коробку налево</title>
  <desc id="sellerDesc">Молодой мужчина в профиль, в желтой футболке и красной кепке, протягивает коробку налево.</desc>
  <defs>
    <linearGradient id="sellerShirt" x1="430" y1="285" x2="650" y2="495" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe13d"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="sellerSkin" x1="230" y1="115" x2="560" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc58f"/>
      <stop offset="1" stop-color="#ff9861"/>
    </linearGradient>
    <linearGradient id="sellerBox" x1="150" y1="270" x2="375" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3bb67"/>
      <stop offset="1" stop-color="#d78c35"/>
    </linearGradient>
  </defs>

